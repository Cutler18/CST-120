<!--Set the DOCTYPE-->
<!DOCTYPE html>
<!--Set the language-->
<html lang="en">
<!--Page head-->

<head>
    <!--jQuery Reference-->
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous">
    </script>
    <!--jQuery Code-->
    <script>
        // Function to display alert when clicked
        function clicked() {
            alert("I was clicked");
        }

        // Define a function to display users
        function displayUsers() {
            // Define a User object with a constructor
            function User(firstName, lastName, age) {
                this.firstName = firstName;
                this.lastName = lastName;
                this.age = age;
            };

            // Define an array of Users and initialize
            var users = [];
            users.push(new User("John", "Lennon", 80), new User("Paul", "McCartney", 78), new User("George", "Harrison",
                53), new User("Ringo", "Star", 80));

            // Dynamically create all the rows in the table
            var x = 0;
            for (var user of users) {
                var rowstyle = x & 1 ? "#FFFFFF" : "#F0F0F0";
                var markup =
                    "<tr>" +
                    "<td>" + user.firstName + "</td>" +
                    "<td>" + user.lastName + "</td>" +
                    "<td>" + user.age + "</td>" +
                    "</tr>";
                $("#users").find("tbody").append(markup);
                $("#users").find("tbody").find("tr").last().attr("id", x);
                $("#users").find("tbody").find("tr").last().attr("align", "center");
                $("#users").find("tbody").find("tr").last().css("background-color", rowstyle);
                $("#users").find("tbody").find("tr").last().find("td").get(0).id = x + "_0";
                $("#users").find("tbody").find("tr").last().find("td").get(1).id = x + "_1";
                $("#users").find("tbody").find("tr").last().find("td").get(2).id = x + "_2";
                ++x;
            }
            $("#0_1").bind('click'.clicked);
        }

        // Update the table
        $(document).ready(displayUsers);
    </script>
    <!--Establish character set-->
    <meta charset="UTF-8" />
    <!--Set the width to the size of the device-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--Title of the page-->
    <title>jQuery</title>
</head>

<body>
    <table id="users" width="50%" border="1">
        <thead>
            <tr style="background-color:#A0A0A0">
                <th width="33%">First Name</th>
                <th width="33%">Last Name</th>
                <th width="33%">Age</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>
</body>

</html>
