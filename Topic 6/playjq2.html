<!--Set the DOCTYPE-->
<!DOCTYPE html>
<!--Set the language-->
<html lang="en">
<!--Page head-->

<head>
    <!--jQuery Reference-->
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous">
    </script>
    <!--jQuery Code-->
    <script>
        var User = {
            firstName: "John",
            lastName: "Lennon",
            age: 80
        };

        // Define a function to write a User into a table row using 2 different jQuery Selectors
        function displayUser() {
            $("#fn").html(User.firstName); // Selector directly to the table data fn id
            $("#users").find("#ln").html(User.lastName); // Selector to ln id from parent table users id
            $("#users").find("#age").html(User.age); // Selector to age id from parent table users id
        }

        // Update our User table using jQuery
        $(document).ready(displayUser);
    </script>
    <!--Establish character set-->
    <meta charset="UTF-8" />
    <!--Set the width to the size of the device-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--Title of the page-->
    <title>jQuery Page 2</title>
</head>

<body>
    <table id="users" width="50" border="1">
        <thead>
            <tr>
                <th width="33%">First Name</th>
                <th width="33%">Last Name</th>
                <th width="33%">Age</th>
            </tr>
        </thead>
        <tbody>
            <tr align="center">
                <td id="fn">?</td>
                <td id="ln">?</td>
                <td id="age">?</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
